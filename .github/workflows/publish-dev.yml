name: publish-stable

on:
  workflow_dispatch:

concurrency:
  group: publish-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Node v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "Publishing version from package.json: $VERSION"
          if npm view "better-aoi.js-fork@$VERSION" version > /dev/null 2>&1; then
            echo "::error::better-aoi.js-fork@$VERSION is already published on npm. Bump the version in package.json first."
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
